<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seesaw Simulation</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="body">
  <img class="playground-image" src="assets/images/36530.jpg" alt="">
  <div class="container">
    <div class="info-panel">
      <h1>Seesaw Simulation</h1>
      <div class="weight-display">
        <div>Left: <span id="leftWeight">0</span> kg</div>
        <div>Right: <span id="rightWeight">0</span> kg</div>
        <button id="resetBtn">Reset</button>
      </div>
    </div>
    <div class="seesaw-container">
      <div id="seesaw" class="seesaw">
        <div class="plank" id="plank">
          <!-- Objects will be added here -->
        </div>
        <div class="pivot"></div>
      </div>
    </div>

  </div>

  <script type="module" src="assets/js/app.js"></script>
</body>

</html>
